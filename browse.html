<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse - FlickyStream</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar injected by app.js -->

  <main>
    <div class="browse-container">
      <div class="browse-filters" id="browseFilters">
        <div class="filter-group">
          <span class="filter-label">Type:</span>
          <button class="filter-btn active" data-type="movie">Movies</button>
          <button class="filter-btn" data-type="tv">TV Shows</button>
        </div>
        <div class="filter-group">
          <span class="filter-label">Sort:</span>
          <button class="filter-btn active" data-sort="popularity.desc">Popular</button>
          <button class="filter-btn" data-sort="vote_average.desc">Top Rated</button>
          <button class="filter-btn" data-sort="primary_release_date.desc">Newest</button>
        </div>
      </div>

      <div class="genre-pills" id="genrePills"></div>

      <div class="browse-grid" id="browseGrid"></div>

      <button class="load-more" id="loadMoreBtn">Load More</button>
    </div>
  </main>

  <!-- Footer injected by app.js -->

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
