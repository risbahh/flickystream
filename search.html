<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - FlickyStream</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar injected by app.js -->

  <main>
    <div class="search-container">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search movies, TV shows..." autofocus>
      </div>

      <div id="searchResults"></div>

      <section id="trendingSection">
        <h2 class="search-title">Trending Now</h2>
        <div class="search-results-grid"></div>
      </section>
    </div>
  </main>

  <!-- Footer injected by app.js -->

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
